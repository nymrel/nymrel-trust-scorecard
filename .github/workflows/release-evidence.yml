name: Exact-commit build evidence

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to package
        required: true
        type: string

permissions: {}

concurrency:
  group: build-evidence-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write # Required to persist the GitHub artifact attestation.
      contents: read
      id-token: write # Required for keyless build-provenance signing.
    steps:
      - name: Checkout main history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Validate and select exact main commit
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character hexadecimal SHA" >&2
            exit 1
          fi
          candidate_sha="${REQUESTED_SHA,,}"
          git fetch --no-tags origin "$candidate_sha"
          actual_sha="$(git rev-parse "$candidate_sha^{commit}")"
          test "$actual_sha" = "$candidate_sha"
          git merge-base --is-ancestor "$candidate_sha" origin/main
          git checkout --detach "$candidate_sha"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "24.20.0"
          package-manager-cache: false # Pin npm before repository devEngines run.

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        shell: pwsh
        # zizmor: ignore[adhoc-packages] npm itself is exact-pinned by packageManager.
        run: |
          npm install --prefix "$env:RUNNER_TEMP/trust-npm" npm@11.19.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/trust-npm/node_modules/.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run complete acceptance gate
        run: npm run check

      - name: Package immutable evidence
        shell: bash
        run: |
          mkdir -p evidence
          package_path="evidence/nymrel-trust-scorecard-${CANDIDATE_SHA}.tar.gz"
          tar -C dist -czf "$package_path" .
          sha256sum "$package_path" > "${package_path}.sha256"
          {
            printf 'commit=%s\n' "$CANDIDATE_SHA"
            printf 'node=%s\n' "$(node --version)"
            printf 'npm=%s\n' "$(npm --version)"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
          } > evidence/build-receipt.txt
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: ${{ env.PACKAGE_PATH }}

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: nymrel-trust-scorecard-${{ env.CANDIDATE_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
